<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeCoinAI – Premium Solana Meme-Coin Trading Platform</title>
    
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            DEFAULT: '#0a0b0d',
                            surface: '#12141a',
                            card: '#1a1d26',
                            border: '#2a2f3d'
                        },
                        brand: {
                            DEFAULT: '#14f195',
                            dark: '#0db870',
                            accent: '#9945ff'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons & Solana Web3 SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body class="bg-dark text-gray-100 font-sans antialiased min-h-screen flex flex-col selection:bg-brand selection:text-dark">

    <!-- Header Navigation -->
    <header class="border-b border-dark-border bg-dark-surface/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-brand to-brand-accent p-2 rounded-xl text-dark font-black text-xl flex items-center justify-center w-10 h-10 shadow-lg shadow-brand/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">MemeCoin<span class="text-brand">AI</span></span>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-400">
                <a href="#explorer" class="text-white hover:text-brand transition">Explorer</a>
                <a href="#swap" class="hover:text-brand transition">Terminal / Swap</a>
                <a href="#sniper" class="hover:text-brand transition">Sniper Bot</a>
                <a href="#premium" class="hover:text-brand transition text-brand flex items-center gap-1.5"><i class="fa-solid fa-crown"></i> Premium</a>
            </nav>

            <div class="flex items-center space-x-3">
                <div id="badge-container" class="hidden sm:flex items-center px-3 py-1 bg-dark-card border border-dark-border rounded-full text-xs font-medium text-gray-300">
                    <span id="tier-indicator" class="w-2 h-2 rounded-full bg-yellow-500 mr-2 animate-pulse"></span> 
                    <span id="tier-text">Free Tier (0,5% Gebühr)</span>
                </div>
                <button id="connect-wallet-btn" onclick="toggleWalletConnection()" class="bg-brand hover:bg-brand-dark text-dark font-semibold px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-brand/10 flex items-center gap-2">
                    <i class="fa-solid fa-wallet"></i> <span id="wallet-btn-text">Wallet verbinden</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hauptbereich -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Stat-Karten Bar -->
        <div class="grid grid-cols-1 sm:grid-cols
