                        <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl">
                            <p class="text-[10px] text-gray-400 font-mono">MKT CAP</p>
                            <p class="text-lg font-black text-neon-green font-mono mt-0.5">${token.mcap || 'N/A'}</p>
                        </div>
                        <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl col-span-2 sm:col-span-1">
                            <p class="text-[10px] text-gray-400 font-mono">24H CHANGE</p>
                            <p class="text-lg font-black ${token.change24h >= 0 ? 'text-neon-green' : 'text-neon-red'} font-mono mt-0.5">${token.change24h}%</p>
                        </div>
                    </div>

                    <!-- BUYS VS SELLS BAR & RATIO -->
                    ${token.price !== 'N/A' ? `
                        <div class="bg-dark-surface border border-dark-border rounded-2xl p-5 space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                                <div class="space-y-1.5">
                                    <div class="flex justify-between text-gray-400 font-mono">
                                        <span>TXNS (${stats.buys + stats.sells})</span>
                                        <span>BUYS ${stats.buys.toLocaleString()} / SELLS${stats.sells.toLocaleString()}</span>
                                    </div>
                                    <div class="w-full h-2.5 bg-neon-red/80 rounded-full overflow-hidden flex">
                                        <div class="bg-neon-green h-full" style="width: ${buyPct}%"></div>
                                    </div>
                                </div>
                                <div class="space-y-1.5">
                                    <div class="flex justify-between text-gray-400 font-mono">
                                        <span>VOLUME</span>
                                        <span>BUY ${stats.buyVol} / SELL${stats.sellVol}</span>
                                    </div>
                                    <div class="w-full h-2.5 bg-neon-red/80 rounded-full overflow-hidden flex">
                                        <div class="bg-neon-green h-full" style="width: 50%"></div>
                                    </div>
                                </div>
                                <div class="space-y-1.5">
                                    <div class="flex justify-between text-gray-400 font-mono">
                                        <span>TRADERS</span>
                                        <span>BUYERS ${stats.buyers.toLocaleString()} / SELLERS${stats.sellers.toLocaleString()}</span>
                                    </div>
                                    <div class="w-full h-2.5 bg-neon-red/80 rounded-full overflow-hidden flex">
                                        <div class="bg-neon-green h-full" style="width: 52%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- MAIN CHART & LIVE TRANSACTIONS TABBED PANEL -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-dark-surface border border-dark-border rounded-2xl p-5 space-y-4">
                            <div class="flex items-center justify-between border-b border-dark-border pb-3">
                                <div class="flex items-center gap-3">
                                    <img src="${token.icon}" onerror="this.src='${getSVGFallback(token.symbol)}'" class="w-8 h-8 rounded-full" alt="Icon">
                                    <span class="font-bold text-white text-sm">${token.name} (${token.symbol})</span>
                                </div>
                            </div>

                            <div class="relative h-80 w-full bg-dark-bg rounded-xl border border-dark-border p-2">
                                <canvas id="detailTokenChart"></canvas>
                            </div>
                        </div>

                        <!-- LIVE TRANSACTIONS & TOP TRADERS TABBED PANEL -->
                        <div class="bg-dark-surface border border-dark-border rounded-2xl p-5 flex flex-col justify-between">
                            <div class="flex border-b border-dark-border pb-3 gap-2">
                                <button onclick="switchTab('txns', ${JSON.stringify(txns).replace(/"/g, '&quot;')}, ${JSON.stringify(traders).replace(/"/g, '&quot;')})" id="tab-txns-btn" class="flex-1 py-2 rounded-xl font-bold text-xs transition bg-neon-purple text-white">
                                    Live Txns
                                </button>
                                <button onclick="switchTab('traders', ${JSON.stringify(txns).replace(/"/g, '&quot;')}, ${JSON.stringify(traders).replace(/"/g, '&quot;')})" id="tab-traders-btn" class="flex-1 py-2 rounded-xl font-bold text-xs transition bg-dark-bg text-gray-400 hover:text-white border border-dark-border">
                                    Top 10 Traders
                                </button>
                            </div>

                            <div id="tab-content" class="mt-4 flex-grow overflow-y-auto max-h-[340px] custom-scrollbar">
                                ${renderTxnsTable(txns)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTxnsTable(txns) {
            if (!txns || txns.length === 0) return `<p class="text-xs text-gray-500 py-6 text-center">Keine Handelsdaten vor dem Launch.</p>`;
            return `
                <table class="w-full text-left text-xs font-mono">
                    <thead>
                        <tr class="text-gray-500 border-b border-dark-border pb-2">
                            <th class="pb-2">TXN</th>
                            <th class="pb-2">USD</th>
                            <th class="pb-2">PRICE</th>
                            <th class="pb-2 text-right">TRADER</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-dark-border/40">
                        ${txns.map(tx => `
                            <tr class="hover:bg-dark-card/50 transition">
                                <td class="py-2 ${tx.isBuyer ? 'text-neon-green' : 'text-neon-red'} flex items-center gap-1 font-bold">
                                    <i class="fa-solid fa-arrow-${tx.isBuyer ? 'up' : 'down'} text-[10px]"></i> ${tx.age}
                                </td>
                                <td class="py-2 ${tx.isBuyer ? 'text-neon-green' : 'text-neon-red'} font-bold">${tx.usd}</td>
                                <td class="py-2 text-gray-300">${tx.price}</td>
                                <td class="py-2 text-right text-neon-purple-bright font-mono">${tx.trader}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderTopTradersTable(traders) {
            if (!traders || traders.length === 0) return `<p class="text-xs text-gray-500 py-6 text-center">Keine Holder-Daten vor dem Launch.</p>`;
            return `
                <table class="w-full text-left text-xs font-mono">
                    <thead>
                        <tr class="text-gray-500 border-b border-dark-border pb-2">
                            <th class="pb-2"># RANK</th>
                            <th class="pb-2">TRADER</th>
                            <th class="pb-2">PNL</th>
                            <th class="pb-2 text-right">HOLDING</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-dark-border/40">
                        ${traders.map(tr => `
                            <tr class="hover:bg-dark-card/50 transition">
                                <td class="py-2 text-neon-green font-bold">${tr.rank}</td>
                                <td class="py-2 text-gray-200 font-mono">${tr.trader}</td>
                                <td class="py-2 text-neon-green font-bold">${tr.pnl}</td>
                                <td class="py-2 text-right text-neon-purple-bright font-bold">${tr.holdings}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function switchTab(tab, txns, traders) {
            const content = document.getElementById('tab-content');
            const btnTxns = document.getElementById('tab-txns-btn');
            const btnTraders = document.getElementById('tab-traders-btn');

            if (tab === 'txns') {
                content.innerHTML = renderTxnsTable(txns);
                btnTxns.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-neon-purple text-white";
                btnTraders.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-dark-bg text-gray-400 hover:text-white border border-dark-border";
            } else {
                content.innerHTML = renderTopTradersTable(traders);
                btnTraders.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-neon-purple text-white";
                btnTxns.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-dark-bg text-gray-400 hover:text-white border border-dark-border";
            }
        }

        // --- CLUB PAGE VIEW ---
        function renderClubPage(clubId) {
            const clubToken = PLATFORM_DATA.tokens.find(t => t.symbol === clubId) || PLATFORM_DATA.nativeToken;
            const messages = PLATFORM_DATA.chats[clubId] || [];

            return `
                <div class="space-y-8">
                    <button onclick="navigateTo('home')" class="text-xs text-neon-purple-bright hover:underline flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> Zurück zur Startseite
                    </button>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-dark-surface border border-dark-border rounded-3xl p-6 flex items-center gap-4">
                                <img src="${clubToken.icon}" onerror="this.src='${getSVGFallback(clubToken.symbol)}'" class="w-14 h-14 rounded-xl object-contain bg-dark-bg p-1" alt="Club Icon">
                                <div>
                                    <h1 class="text-2xl font-black text-white">${clubToken.name} Community Club</h1>
                                    <p class="text-xs text-neon-green">Exklusiver Chatbereich für ${clubToken.symbol}-Halter</p>
                                </div>
                            </div>

                            <div class="bg-dark-surface border border-dark-border rounded-3xl p-6 space-y-4 flex flex-col h-[500px]">
                                <h3 class="text-sm font-bold text-gray-300 border-b border-dark-border pb-3">LIVE COMMUNITY CHAT</h3>
                                <div id="club-chat-messages" class="flex-grow overflow-y-auto space-y-3 pr-2">
                                    ${messages.map(m => `
                                        <div class="bg-dark-bg p-3 rounded-xl border border-dark-border text-xs space-y-1">
                                            <div class="flex justify-between font-bold text-neon-purple-bright">
                                                <span>${m.user}</span>
                                                <span class="text-gray-500 font-normal text-[10px]">${m.time}</span>
                                            </div>
                                            <p class="text-gray-200">${m.msg}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="flex gap-2 pt-2 border-t border-dark-border">
                                    <input type="text" id="chat-input-field" placeholder="Sende eine Nachricht an den ${clubId}-Club..." class="flex-grow bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-neon-purple">
                                    <button onclick="sendClubMessage('${clubId}')" class="bg-neon-purple hover:bg-neon-purple-bright text-white px-5 py-2.5 rounded-xl font-bold text-xs transition">Senden</button>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-dark-surface border border-neon-purple/40 rounded-3xl p-6 space-y-4 shadow-glow-purple">
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <i class="fa-solid fa-robot text-neon-green"></i> AI ANALYSIS
                                </h3>
                                <p class="text-xs text-gray-300 leading-relaxed">
                                    Starke Aktivität im ${clubId}-Club. Echzeit-Datenprüfung aktiv.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderClubsOverviewPage() {
            return `<div class="text-center py-12"><h1 class="text-3xl font-bold text-white">Alle Clubs</h1><p class="text-xs text-gray-400 mt-2">Wähle auf der Startseite einen Token aus, um seinen Club zu betreten.</p></div>`;
        }

        // --- CHARTS INITIALIZERS ---
        function initNativeChart() {
            const ctx = document.getElementById('nativeTokenChart');
            if (!ctx) return;
            if (activeChartInstance) activeChartInstance.destroy();

            activeChartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['10:00', '11:00', '12:00', '13:00', '14:00', 'Jetzt'],
                    datasets: [{
                        label: 'MEMECOINAI Index (Pre-Launch)',
                        data: [100, 100, 100, 100, 100, 100],
                        borderColor: '#a855f7',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(35, 40, 56, 0.4)' }, ticks: { color: '#6b7280', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(35, 40, 56, 0.4)' }, ticks: { color: '#6b7280', font: { size: 10 } } }
                    }
                }
            });
        }

        function initDetailChart(token) {
            const ctx = document.getElementById('detailTokenChart');
            if (!ctx) return;
            if (activeChartInstance) activeChartInstance.destroy();

            const p = token.price === 'N/A' ? 1.0 : token.price;

            activeChartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['18:00', '19:00', '20:00', '21:00', '22:00', 'Jetzt'],
                    datasets: [{
                        label: token.symbol,
                        data: [p*0.9, p*0.95, p*0.92, p*0.98, p],
                        borderColor: '#14f195',
                        borderWidth: 2,
                        backgroundColor: 'rgba(20, 241, 149, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(35, 40, 56, 0.4)' }, ticks: { color: '#6b7280', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(35, 40, 56, 0.4)' }, ticks: { color: '#6b7280', font: { size: 10 } } }
                    }
                }
            });
        }

        function sendClubMessage(clubId) {
            const input = document.getElementById('chat-input-field');
            if (!input || !input.value.trim()) return;

            if (!PLATFORM_DATA.chats[clubId]) PLATFORM_DATA.chats[clubId] = [];
            PLATFORM_DATA.chats[clubId].push({
                user: connectedWallet ? connectedWallet.slice(0, 4) + '...' + connectedWallet.slice(-4) : "User_" + Math.floor(Math.random()*1000),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                msg: input.value.trim()
            });

            input.value = '';
            navigateTo('club', clubId);
        }

        function toggleWallet() {
            if ("solana" in window) {
                window.solana.connect().then(res => {
                    connectedWallet = res.publicKey.toString();
                    document.getElementById('wallet-text').innerText = connectedWallet.slice(0, 4) + '...' + connectedWallet.slice(-4);
                }).catch(e => {});
            } else {
                alert("Bitte Phantom Wallet installieren.");
            }
        }

        window.onload = () => {
            navigateTo('home');
        };
    </script>
</body>
</html>
