<!DOCTYPE html>
<html lang="de" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeCoinAI – Advanced DexScreener-Style Terminal</title>
    
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            purple: '#a855f7',
                            'purple-bright': '#c084fc',
                            'purple-dark': '#581c87',
                            green: '#14f195',
                            'green-bright': '#22c55e',
                            'green-dark': '#065f46',
                            red: '#ef4444',
                            'red-dark': '#991b1b'
                        },
                        dark: {
                            bg: '#060709',
                            surface: '#0d0f14',
                            card: '#141721',
                            border: '#232838'
                        }
                    },
                    boxShadow: {
                        'glow-purple': '0 0 25px -5px rgba(168, 85, 247, 0.4)',
                        'glow-green': '0 0 25px -5px rgba(20, 241, 149, 0.4)'
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #060709; }
        ::-webkit-scrollbar-thumb { background: #232838; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }

        .neon-border-purple { border: 1px solid rgba(168, 85, 247, 0.3); }
        .neon-border-green { border: 1px solid rgba(20, 241, 149, 0.3); }
    </style>
</head>
<body class="bg-dark-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-dark-border bg-dark-surface/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" onclick="navigateTo('home')" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-neon-purple to-neon-green p-0.5 rounded-xl">
                    <div class="w-full h-full bg-dark-bg rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-brain text-neon-green text-lg"></i>
                    </div>
                </div>
                <span class="text-xl font-black text-white">MEMECOIN<span class="text-neon-green">AI</span></span>
            </a>

            <div class="flex items-center space-x-4">
                <button onclick="toggleWallet()" id="wallet-btn" class="bg-neon-purple hover:bg-neon-purple-bright text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-wallet"></i> <span id="wallet-text">Wallet verbinden</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Root -->
    <main id="app-root" class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <!-- Dynamischer DexScreener Terminal Inhalt -->
    </main>

    <script>
        // Data Structure matching DexScreener Screenshot Data
        const ACTIVE_TOKEN = {
            name: "Pokémon",
            symbol: "Pokémon",
            pair: "Pokémon / CARDS",
            pairAddress: "CxyUG...31an",
            tokenAddress: "D42Tj...Xvb1",
            priceUsd: "$0.002195",
            priceNative: "0.006060 CARDS",
            liquidity: "$172K",
            fdv: "$2.1M",
            mcap: "$2.1M",
            pairCreated: "1d 23h ago",
            pooledToken: "40,761,671 ($87K)",
            pooledSol: "247,445 ($84K)",
            icon: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><rect width='80' height='80' rx='20' fill='%23141721'/><circle cx='40' cy='40' r='25' fill='%23ef4444'/><path d='M15 40 H65' stroke='%23ffffff' stroke-width='6'/><circle cx='40' cy='40' r='8' fill='%23ffffff'/></svg>",
            timeframes: {
                m5: { change: "-0.93%", txns: "80,052", buys: 44059, sells: 35993, buyVol: "$2.5M", sellVol: "$2.5M", buyers: 8169, sellers: 8132 },
                h1: { change: "+23.87%", txns: "80,052", buys: 44059, sells: 35993, buyVol: "$2.5M", sellVol: "$2.5M", buyers: 8169, sellers: 8132 },
                h6: { change: "+87.28%", txns: "80,052", buys: 44059, sells: 35993, buyVol: "$2.5M", sellVol: "$2.5M", buyers: 8169, sellers: 8132 },
                h24: { change: "+14,565%", txns: "80,052", buys: 44059, sells: 35993, buyVol: "$2.5M", sellVol: "$2.5M", buyers: 8169, sellers: 8132 }
            },
            txnsList: [
                { type: "sell", age: "0s", usd: "$171", price: "$0.002177", trader: "gTciPZ", isBuyer: false },
                { type: "sell", age: "0s", usd: "$14", price: "$0.002175", trader: "ng7wCT", isBuyer: false },
                { type: "sell", age: "0s", usd: "$4", price: "$0.002176", trader: "vxJxHL", isBuyer: false },
                { type: "sell", age: "0s", usd: "$130", price: "$0.002185", trader: "5EiXMX", isBuyer: false },
                { type: "buy", age: "0s", usd: "$4", price: "$0.002212", trader: "yh88qe", isBuyer: true },
                { type: "buy", age: "2s", usd: "$850", price: "$0.002215", trader: "7xKP9a", isBuyer: true },
                { type: "buy", age: "5s", usd: "$1,240", price: "$0.002218", trader: "9mLZ12", isBuyer: true }
            ],
            topTraders: [
                { rank: "#1", trader: "7xKP9a...99a1", bought: "$45,200", sold: "$12,100", pnl: "+$33,100", holdings: "2.4%" },
                { rank: "#2", trader: "gTciPZ...12x4", bought: "$38,000", sold: "$29,400", pnl: "+$8,600", holdings: "1.8%" },
                { rank: "#3", trader: "5EiXMX...33b1", bought: "$22,500", sold: "$5,000", pnl: "+$17,500", holdings: "1.5%" },
                { rank: "#4", trader: "yh88qe...88f2", bought: "$19,100", sold: "$18,000", pnl: "+$1,100", holdings: "0.9%" },
                { rank: "#5", trader: "vxJxHL...77a1", bought: "$15,000", sold: "$0", pnl: "+$15,000", holdings: "0.8%" },
                { rank: "#6", trader: "9mLZ12...00c1", bought: "$14,200", sold: "$2,100", pnl: "+$12,100", holdings: "0.7%" },
                { rank: "#7", trader: "ng7wCT...44d9", bought: "$12,000", sold: "$11,500", pnl: "+$500", holdings: "0.5%" },
                { rank: "#8", trader: "11aBCd...99e3", bought: "$11,400", sold: "$1,000", pnl: "+$10,400", holdings: "0.4%" },
                { rank: "#9", trader: "33xYYz...22a1", bought: "$9,800", sold: "$4,000", pnl: "+$5,800", holdings: "0.4%" },
                { rank: "#10", trader: "88mKKp...11z9", bought: "$8,500", sold: "$0", pnl: "+$8,500", holdings: "0.3%" }
            ]
        };

        let activeTab = 'txns'; // 'txns' or 'traders'
        let chartInstance = null;

        function renderDexTerminal() {
            const t = ACTIVE_TOKEN;
            const tf = t.timeframes.h24; // Default 24H View

            // Percentage Buys vs Sells calculation
            const buyPct = ((tf.buys / (tf.buys + tf.sells)) * 100).toFixed(1);
            const sellPct = (100 - buyPct).toFixed(1);

            return `
                <!-- DEXSCREENER HEADER CARDS -->
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl">
                        <p class="text-[10px] text-gray-400 font-mono">PRICE USD</p>
                        <p class="text-lg font-black text-white font-mono mt-0.5">${t.priceUsd}</p>
                    </div>
                    <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl">
                        <p class="text-[10px] text-gray-400 font-mono">PRICE NATIVE</p>
                        <p class="text-xs font-bold text-gray-300 font-mono mt-1">${t.priceNative}</p>
                    </div>
                    <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl">
                        <p class="text-[10px] text-gray-400 font-mono">LIQUIDITY <i class="fa-solid fa-lock text-neon-green text-[10px] ml-1"></i></p>
                        <p class="text-lg font-black text-white font-mono mt-0.5">${t.liquidity}</p>
                    </div>
                    <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl">
                        <p class="text-[10px] text-gray-400 font-mono">FDV</p>
                        <p class="text-lg font-black text-white font-mono mt-0.5">${t.fdv}</p>
                    </div>
                    <div class="bg-dark-surface border border-dark-border p-3.5 rounded-xl col-span-2 sm:col-span-1">
                        <p class="text-[10px] text-gray-400 font-mono">MKT CAP</p>
                        <p class="text-lg font-black text-neon-green font-mono mt-0.5">${t.mcap}</p>
                    </div>
                </div>

                <!-- BUYS VS SELLS BAR & TIMEFRAME STATS -->
                <div class="bg-dark-surface border border-dark-border rounded-2xl p-5 space-y-4">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center border-b border-dark-border pb-4">
                        <div class="p-2 bg-dark-bg rounded-lg border border-dark-border">
                            <p class="text-[10px] text-gray-400">5M</p>
                            <p class="text-xs font-bold text-neon-red">${t.timeframes.m5.change}</p>
                        </div>
                        <div class="p-2 bg-dark-bg rounded-lg border border-dark-border">
                            <p class="text-[10px] text-gray-400">1H</p>
                            <p class="text-xs font-bold text-neon-green">${t.timeframes.h1.change}</p>
                        </div>
                        <div class="p-2 bg-dark-bg rounded-lg border border-dark-border">
                            <p class="text-[10px] text-gray-400">6H</p>
                            <p class="text-xs font-bold text-neon-green">${t.timeframes.h6.change}</p>
                        </div>
                        <div class="p-2 bg-dark-bg rounded-lg border border-neon-purple/50 bg-neon-purple-dark/20">
                            <p class="text-[10px] text-neon-purple-bright font-bold">24H</p>
                            <p class="text-xs font-black text-neon-green">${t.timeframes.h24.change}</p>
                        </div>
                    </div>

                    <!-- Volume & Buy/Sell Ratio Progress Bars -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                        <!-- TXNS -->
                        <div class="space-y-1.5">
                            <div class="flex justify-between text-gray-400 font-mono">
                                <span>TXNS ${tf.txns}</span>
                                <span>BUYS ${tf.buys.toLocaleString()} / SELLS ${tf.sells.toLocaleString()}</span>
                            </div>
                            <div class="w-full h-2.5 bg-neon-red/80 rounded-full overflow-hidden flex">
                                <div class="bg-neon-green h-full" style="width: ${buyPct}%"></div>
                            </div>
                        </div>

                        <!-- VOLUME -->
                        <div class="space-y-1.5">
                            <div class="flex justify-between text-gray-400 font-mono">
                                <span>VOLUME ${tf.buyVol}</span>
                                <span>BUY ${tf.buyVol} / SELL ${tf.sellVol}</span>
                            </div>
                            <div class="w-full h-2.5 bg-neon-red/80 rounded-full overflow-hidden flex">
                                <div class="bg-neon-green h-full" style="width: 50%"></div>
                            </div>
                        </div>

                        <!-- TRADERS -->
                        <div class="space-y-1.5">
                            <div class="flex justify-between text-gray-400 font-mono">
                                <span>TRADERS 10,550</span>
                                <span>BUYERS ${tf.buyers.toLocaleString()} / SELLERS ${tf.sellers.toLocaleString()}</span>
                            </div>
                            <div class="w-full h-2.5 bg-neon-red/80 rounded-full overflow-hidden flex">
                                <div class="bg-neon-green h-full" style="width: 50.1%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MAIN CHART & LIVE TRANSACTIONS SECTION -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- CANDLESTICK CHART -->
                    <div class="lg:col-span-2 bg-dark-surface border border-dark-border rounded-2xl p-5 space-y-4">
                        <div class="flex items-center justify-between border-b border-dark-border pb-3">
                            <div class="flex items-center gap-3">
                                <img src="${t.icon}" class="w-8 h-8 rounded-full" alt="Icon">
                                <span class="font-bold text-white text-sm">${t.pair}</span>
                                <span class="text-xs text-neon-green font-mono">${t.priceUsd}</span>
                            </div>
                            <div class="flex gap-1.5 text-xs font-mono">
                                <button class="px-2 py-1 rounded bg-dark-bg border border-dark-border text-gray-300">1m</button>
                                <button class="px-2 py-1 rounded bg-neon-purple text-white font-bold">15m</button>
                                <button class="px-2 py-1 rounded bg-dark-bg border border-dark-border text-gray-300">1h</button>
                                <button class="px-2 py-1 rounded bg-dark-bg border border-dark-border text-gray-300">4h</button>
                            </div>
                        </div>

                        <div class="relative h-80 w-full bg-dark-bg rounded-xl border border-dark-border p-2">
                            <canvas id="candleChart"></canvas>
                        </div>
                    </div>

                    <!-- LIVE TRANSACTIONS & TOP TRADERS TABBED PANEL -->
                    <div class="bg-dark-surface border border-dark-border rounded-2xl p-5 flex flex-col justify-between">
                        <!-- Navigation Tabs -->
                        <div class="flex border-b border-dark-border pb-3 gap-2">
                            <button onclick="switchTab('txns')" id="tab-txns-btn" class="flex-1 py-2 rounded-xl font-bold text-xs transition bg-neon-purple text-white">
                                <i class="fa-solid fa-list-ul mr-1"></i> Live Txns
                            </button>
                            <button onclick="switchTab('traders')" id="tab-traders-btn" class="flex-1 py-2 rounded-xl font-bold text-xs transition bg-dark-bg text-gray-400 hover:text-white border border-dark-border">
                                <i class="fa-solid fa-trophy text-neon-green mr-1"></i> Top 10 Traders
                            </button>
                        </div>

                        <!-- Dynamic Content Container -->
                        <div id="tab-content" class="mt-4 flex-grow overflow-y-auto max-h-[340px] custom-scrollbar">
                            ${renderTxnsContent()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTxnsContent() {
            const txns = ACTIVE_TOKEN.txnsList;
            return `
                <table class="w-full text-left text-xs font-mono">
                    <thead>
                        <tr class="text-gray-500 border-b border-dark-border pb-2">
                            <th class="pb-2">TXN</th>
                            <th class="pb-2">USD</th>
                            <th class="pb-2">PRICE</th>
                            <th class="pb-2 text-right">TRADER</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-dark-border/40">
                        ${txns.map(tx => `
                            <tr class="hover:bg-dark-card/50 transition">
                                <td class="py-2 ${tx.isBuyer ? 'text-neon-green' : 'text-neon-red'} flex items-center gap-1 font-bold">
                                    <i class="fa-solid fa-arrow-${tx.isBuyer ? 'up' : 'down'} text-[10px]"></i> ${tx.age}
                                </td>
                                <td class="py-2 ${tx.isBuyer ? 'text-neon-green' : 'text-neon-red'} font-bold">${tx.usd}</td>
                                <td class="py-2 text-gray-300">${tx.price}</td>
                                <td class="py-2 text-right text-neon-purple-bright font-mono">${tx.trader}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderTopTradersContent() {
            const traders = ACTIVE_TOKEN.topTraders;
            return `
                <table class="w-full text-left text-xs font-mono">
                    <thead>
                        <tr class="text-gray-500 border-b border-dark-border pb-2">
                            <th class="pb-2"># RANK</th>
                            <th class="pb-2">TRADER</th>
                            <th class="pb-2">PNL</th>
                            <th class="pb-2 text-right">HOLDING</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-dark-border/40">
                        ${traders.map(tr => `
                            <tr class="hover:bg-dark-card/50 transition">
                                <td class="py-2 text-neon-green font-bold">${tr.rank}</td>
                                <td class="py-2 text-gray-200 font-mono">${tr.trader}</td>
                                <td class="py-2 text-neon-green font-bold">${tr.pnl}</td>
                                <td class="py-2 text-right text-neon-purple-bright font-bold">${tr.holdings}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function switchTab(tab) {
            activeTab = tab;
            const content = document.getElementById('tab-content');
            const btnTxns = document.getElementById('tab-txns-btn');
            const btnTraders = document.getElementById('tab-traders-btn');

            if (tab === 'txns') {
                content.innerHTML = renderTxnsContent();
                btnTxns.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-neon-purple text-white";
                btnTraders.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-dark-bg text-gray-400 hover:text-white border border-dark-border";
            } else {
                content.innerHTML = renderTopTradersContent();
                btnTraders.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-neon-purple text-white";
                btnTxns.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-dark-bg text-gray-400 hover:text-white border border-dark-border";
            }
        }

        function initCandleChart() {
            const ctx = document.getElementById('candleChart');
            if (!ctx) return;

            chartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['18:00', '19:00', '20:00', '21:00', '22:00', '23:00', '00:00', 'Jetzt'],
                    datasets: [{
                        label: 'Price USD',
                        data: [0.00125, 0.00140, 0.00132, 0.00175, 0.00160, 0.00210, 0.00195, 0.002195],
                        borderColor: '#14f195',
                        borderWidth: 2,
                        backgroundColor: 'rgba(20, 241, 149, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(35, 40, 56, 0.3)' }, ticks: { color: '#6b7280', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(35, 40, 56, 0.3)' }, ticks: { color: '#6b7280', font: { size: 10 } } }
                    }
                }
            });
        }

        function toggleWallet() {
            if ("solana" in window) {
                window.solana.connect().then(res => {
                    const key = res.publicKey.toString();
                    document.getElementById('wallet-text').innerText = key.slice(0, 4) + '...' + key.slice(-4);
                }).catch(e => {});
            } else {
                alert("Bitte Phantom Wallet installieren.");
            }
        }

        window.onload = () => {
            document.getElementById('app-root').innerHTML = renderDexTerminal();
            initCandleChart();
        };
    </script>
</body>
</html>
