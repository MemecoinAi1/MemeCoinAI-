                <div class="space-y-8">
                    <button onclick="navigateTo('home')" class="text-xs text-neon-purple-bright hover:underline flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> Zurück zur Übersicht
                    </button>

                    <div class="bg-dark-surface border border-dark-border rounded-3xl p-8 space-y-6">
                        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 border-b border-dark-border pb-6">
                            <div class="flex items-center gap-4">
                                <img src="${token.icon}" onerror="this.src='${getSVGFallback(token.symbol)}'" class="w-16 h-16 rounded-2xl object-contain bg-dark-bg p-1 border border-neon-purple" alt="${token.symbol}">
                                <div>
                                    <h1 class="text-3xl font-black text-white">${token.name} (${token.symbol})</h1>
                                    <p class="text-xs text-gray-400 font-mono mt-1">Mint: ${token.mint}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-400">Aktueller Preis</p>
                                <p class="text-3xl font-black text-white font-mono">${token.price === 'N/A' ? 'PRE-LAUNCH' : '$' + token.price}</p>
                            </div>
                        </div>

                        <!-- Detailed Chart -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-gray-300">INTERAKTIVES KURS-CHART</h3>
                            <div class="relative h-80 w-full bg-dark-bg rounded-2xl border border-dark-border p-4">
                                <canvas id="genericTokenChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // -------------------------------------------------------------
        // 6. CLUB PAGE WITH SEPARATE CHATS VIEW
        // -------------------------------------------------------------
        function renderClubPage(clubId) {
            const clubToken = PLATFORM_DATA.tokens.find(t => t.symbol === clubId) || PLATFORM_DATA.nativeToken;
            const messages = PLATFORM_DATA.chats[clubId] || [];

            return `
                <div class="space-y-8">
                    <button onclick="navigateTo('home')" class="text-xs text-neon-purple-bright hover:underline flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> Zurück zur Startseite
                    </button>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-dark-surface border border-dark-border rounded-3xl p-6 flex items-center gap-4">
                                <img src="${clubToken.icon}" onerror="this.src='${getSVGFallback(clubToken.symbol)}'" class="w-14 h-14 rounded-xl object-contain bg-dark-bg p-1" alt="Club Icon">
                                <div>
                                    <h1 class="text-2xl font-black text-white">${clubToken.name} Community Club</h1>
                                    <p class="text-xs text-neon-green">Exklusiver Chatbereich für ${clubToken.symbol}-Halter</p>
                                </div>
                            </div>

                            <!-- Dedicated Chat Box -->
                            <div class="bg-dark-surface border border-dark-border rounded-3xl p-6 space-y-4 flex flex-col h-[500px]">
                                <h3 class="text-sm font-bold text-gray-300 border-b border-dark-border pb-3">LIVE COMMUNITY CHAT</h3>
                                <div id="club-chat-messages" class="flex-grow overflow-y-auto space-y-3 pr-2">
                                    ${messages.map(m => `
                                        <div class="bg-dark-bg p-3 rounded-xl border border-dark-border text-xs space-y-1">
                                            <div class="flex justify-between font-bold text-neon-purple-bright">
                                                <span>${m.user}</span>
                                                <span class="text-gray-500 font-normal text-[10px]">${m.time}</span>
                                            </div>
                                            <p class="text-gray-200">${m.msg}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="flex gap-2 pt-2 border-t border-dark-border">
                                    <input type="text" id="chat-input-field" placeholder="Sende eine Nachricht an den ${clubId}-Club..." class="flex-grow bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-neon-purple">
                                    <button onclick="sendClubMessage('${clubId}')" class="bg-neon-purple hover:bg-neon-purple-bright text-white px-5 py-2.5 rounded-xl font-bold text-xs transition">Senden</button>
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar: KI-Analyse Panel -->
                        <div class="space-y-6">
                            <div class="bg-dark-surface border border-neon-purple/40 rounded-3xl p-6 space-y-4 shadow-glow-purple">
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <i class="fa-solid fa-robot text-neon-green"></i> AI ANALYSIS
                                </h3>
                                <div class="text-xs text-gray-300 space-y-3 leading-relaxed">
                                    <p><strong>Projekt-Typ:</strong> Solana Utility & Meme Hybrid.</p>
                                    <p><strong>Risiko-Score:</strong> <span class="text-neon-green font-bold">Niedrig (Geprüfter Pre-Launch)</span></p>
                                    <p><strong>Zusammenfassung:</strong> Starke Community-Aktivität im ${clubId}-Club mit Fokus auf verifizierte Metadaten.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderClubsOverviewPage() {
            return `<div class="text-center py-12"><h1 class="text-3xl font-bold text-white">Alle Clubs</h1><p class="text-xs text-gray-400 mt-2">Wähle oben einen Token aus, um seinen Club zu betreten.</p></div>`;
        }

        function renderAIAnalysisPage() {
            return `<div class="text-center py-12"><h1 class="text-3xl font-bold text-white">AI Analysis Dashboard</h1><p class="text-xs text-gray-400 mt-2">Automatische KI-Zusammenfassungen aller Solana Token-Launches.</p></div>`;
        }

        // -------------------------------------------------------------
        // 7. CHART INITIALIZERS (USING CHART.JS)
        // -------------------------------------------------------------
        function initNativeChart(tf) {
            const ctx = document.getElementById('nativeTokenChart');
            if (!ctx) return;

            if (activeChartInstance) activeChartInstance.destroy();

            activeChartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['10:00', '11:00', '12:00', '13:00', '14:00', 'Jetzt'],
                    datasets: [{
                        label: 'MEMECOINAI Index (Pre-Launch)',
                        data: [100, 100, 100, 100, 100, 100],
                        borderColor: '#a855f7',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(35, 40, 56, 0.4)' }, ticks: { color: '#6b7280', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(35, 40, 56, 0.4)' }, ticks: { color: '#6b7280', font: { size: 10 } } }
                    }
                }
            });
        }

        function initGenericChart(token, tf) {
            const ctx = document.getElementById('genericTokenChart');
            if (!ctx) return;

            if (activeChartInstance) activeChartInstance.destroy();

            activeChartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
                    datasets: [{
                        label: token.name,
                        data: [token.price*0.9, token.price*0.95, token.price*0.92, token.price*0.98, token.price],
                        borderColor: '#14f195',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function changeNativeChartTimeframe(tf) {
            initNativeChart(tf);
        }

        // -------------------------------------------------------------
        // 8. CHAT INTERACTION & WALLET TOGGLE
        // -------------------------------------------------------------
        function sendClubMessage(clubId) {
            const input = document.getElementById('chat-input-field');
            if (!input || !input.value.trim()) return;

            if (!PLATFORM_DATA.chats[clubId]) PLATFORM_DATA.chats[clubId] = [];
            
            PLATFORM_DATA.chats[clubId].push({
                user: connectedWallet ? connectedWallet.slice(0, 4) + '...' + connectedWallet.slice(-4) : "User_" + Math.floor(Math.random()*1000),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                msg: input.value.trim()
            });

            input.value = '';
            navigateTo('club', clubId);
        }

        async function toggleWallet() {
            if ("solana" in window) {
                try {
                    const res = await window.solana.connect();
                    connectedWallet = res.publicKey.toString();
                    document.getElementById('wallet-text').innerText = connectedWallet.slice(0, 4) + '...' + connectedWallet.slice(-4);
                } catch (e) {}
            } else {
                alert("Bitte Phantom Wallet installieren.");
            }
        }

        // App Start
        window.onload = () => {
            navigateTo('home');
        };
    </script>
</body>
</html>
